version: "3"
name: "FastApi"

services:
  postgresql:
    image: postgres
    container_name: postgresql
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: Database
      PGDATA: ~/postgres_data
    ports:
      - "5432:5432"
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

#  mongodb:
#    image: mongo
#    container_name: mongodb
#    environment:
#      MONGO_INITDB_ROOT_USERNAME: root
#      MONGO_INITDB_ROOT_PASSWORD: root
#    ports:
#      - "27017:27017"
#    networks:
#      - app-network

  rabbitmq_worker:
    build: ./workers/rabbitmq
    working_dir: /app
    container_name: rabbitmq_worker
    restart: always
    networks:
      - app-network

  main:
    build: .
    working_dir: /app
    container_name: fastapi
    restart: always
    ports:
      - "8000:8000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
